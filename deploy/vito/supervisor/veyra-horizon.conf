; Example Supervisor program for Horizon. In Vito, create an equivalent
; "Worker" for the site; adjust paths, user and PHP binary.
[program:veyra-horizon]
process_name=%(program_name)s
command=/usr/bin/php8.4 /home/vito/veyra.example.com/artisan horizon
directory=/home/vito/veyra.example.com
user=vito
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/home/vito/veyra.example.com/storage/logs/horizon.log
