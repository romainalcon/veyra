; Example Supervisor program for Reverb. Expose it through Nginx
; (see docs/deployment/VITO.md) rather than publicly on port 8080.
[program:veyra-reverb]
process_name=%(program_name)s
command=/usr/bin/php8.4 /home/vito/veyra.example.com/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/home/vito/veyra.example.com
user=vito
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
minfds=10000
redirect_stderr=true
stdout_logfile=/home/vito/veyra.example.com/storage/logs/reverb.log
